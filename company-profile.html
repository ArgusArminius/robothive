<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company profile — behindrobotics.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://behindrobotics.com/companies.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script>
  // company-profile.html is now a redirect: the full company profile lives inside
  // companies.html's own tabbed view (companies.html?id=<id> opens straight to it).
  // This keeps every previously-shared or bookmarked company-profile.html link working.
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    var target = id ? 'companies.html?id=' + encodeURIComponent(id) : 'companies.html';
    location.replace(target);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=companies.html"></noscript>
<style>body{font-family:Inter,-apple-system,sans-serif;background:#f5f6f8;color:#3c4654;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}

<body>
<p>Taking you to the company profile… if you're not redirected, <a id="fallback" href="companies.html">continue here</a>.</p>
<script>
  var id2 = new URLSearchParams(location.search).get('id');
  document.getElementById('fallback').href = id2 ? 'companies.html?id=' + encodeURIComponent(id2) : 'companies.html';
</script>
</body></html>
